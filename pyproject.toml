[tool.ruff]
target-version = "py314"
extend-exclude = ["runs", ".venv", ".repro"]

[tool.ruff.lint]
# Error-like checks and import order; no line-length or formatting migration.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["sa_engine"]

[tool.coverage.report]
show_missing = true
precision = 1
